# Render 蓝图：https://render.com/docs/blueprint-spec
# 用法：Render 控制台 → New → Blueprint → 选这个仓库 → Apply
services:
  - type: web
    name: biejie-fanzha
    runtime: python
    plan: free
    region: singapore
    rootDir: 反诈站
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: HOST
        value: 0.0.0.0
      - key: DEEPSEEK_API_KEY
        sync: false          # 部署时在网页里填，不进仓库
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: KEY_SECRET
        sync: false
